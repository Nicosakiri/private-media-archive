<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="本地记录书籍、电影及电视剧、动漫、综艺的进度、平台、评分和感想。"
    />
    <meta name="theme-color" content="#17171c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PMA" />
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%pma-icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Private Media Archive</title>
    <script>
      try {
        var savedTheme = localStorage.getItem("private-media-archive-theme");
        if (savedTheme === "dark") document.documentElement.dataset.theme = "dark";
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
